name: zl-quality-kit

# File owned by @alexandregme/zl-quality-kit: `zl-lint init` rewrites it on
# every run, so don't edit it here. Per-repo settings go in package.json, under
# the "zlQualityKit" key (prettierPaths, reviewers, build, test).
#
# Every Wednesday, 09:00 Brasília (12:00 UTC): updates the kit, runs init, lint
# and build, and opens a PR requesting a review from the repo owner. On
# Thursday, zljs-update.yml does the same for zljs. The logic lives in
# alexandregme/zl-workflows.
on:
  schedule:
    - cron: "0 12 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    uses: alexandregme/zl-workflows/.github/workflows/zl-quality-kit.yml@main
    # Optional repo secret: ZL_GH_TOKEN (PAT; the commit and the PR are made as you).
    secrets: inherit
